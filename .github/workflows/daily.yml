name: daily
on:
  schedule:
    # GitHub 예약 실행은 정각에 몰려 지연·누락이 잦다. 분을 비껴가고 백업 실행을 둔다.
    - cron: "17 12 * * 1-5"   # UTC 12:17 = KST 21:17 (1차)
    - cron: "3 14 * * 1-5"    # UTC 14:03 = KST 23:03 (백업, 이미 보냈으면 알림 생략)
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 한글 폰트 설치 (차트용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          rm -rf ~/.cache/matplotlib
      - run: pip install -r requirements.txt
      - name: 일일 수집
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py
      - name: 저장
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "data: $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git pull --rebase -q || true
          git push
